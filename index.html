<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valmortheos — a.k.a Valmortheoz</title>
  <meta name="description" content="Valmortheos, 19 tahun. Suka coding biasa. HTML, CSS, JS, Python, Java." />
  <meta name="theme-color" content="#FAF7F2" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">

    <!-- HERO -->
    <header class="hero">
      <div class="coin" role="button" tabindex="0" aria-label="Avatar Valmortheos — klik untuk membalik">
        <div class="coin-inner">
          <div class="coin-face coin-front">
            <img src="foto.jpg" alt="Foto profil Valmortheos" onerror="this.style.display='none'" />
          </div>
          <div class="coin-face coin-back" aria-hidden="true">
            <span>VM</span>
          </div>
        </div>
      </div>

      <h1 class="name" aria-label="Valmortheos">Valmortheos</h1>

      <p class="aka">
        <span class="arcade">Valmortheoz</span><span class="cursor" aria-hidden="true">_</span>
      </p>

      <p class="age">19 tahun</p>
      <p class="tagline">Suka coding biasa.</p>
    </header>

    <!-- SKILLS -->
    <section class="block reveal" aria-labelledby="skills-label">
      <h2 id="skills-label" class="label">Skills</h2>
      <ul class="chips">
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="" />
          <span>HTML</span>
        </li>
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="" />
          <span>CSS</span>
        </li>
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" alt="" />
          <span>JavaScript</span>
        </li>
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="" />
          <span>Python</span>
        </li>
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="" />
          <span>Java</span>
        </li>
      </ul>
    </section>

    <!-- DEVICES -->
    <section class="block reveal" aria-labelledby="devices-label">
      <h2 id="devices-label" class="label">Devices</h2>
      <ul class="chips">
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/android/android-original.svg" alt="" />
          <span>Android</span>
        </li>
        <li class="chip">
          <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/windows8/windows8-original.svg" alt="" />
          <span>Windows</span>
        </li>
        <li class="chip">
          <img src="https://cdn.simpleicons.org/kalilinux" alt="" />
          <span>Kali Linux</span>
        </li>
      </ul>
    </section>

    <!-- CONTACT -->
    <section class="block reveal" aria-labelledby="contact-label">
      <h2 id="contact-label" class="label">Hubungi aku</h2>
      <ul class="links">
        <li>
          <a href="https://www.instagram.com/valmortheoz" target="_blank" rel="noopener noreferrer">
            <span class="link-name">Instagram</span>
            <span class="link-handle">@valmortheoz</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="https://github.com/valmortheos" target="_blank" rel="noopener noreferrer">
            <span class="link-name">GitHub</span>
            <span class="link-handle">valmortheos</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
        <li>
          <a href="https://www.kaggle.com/valmortheos" target="_blank" rel="noopener noreferrer">
            <span class="link-name">Kaggle</span>
            <span class="link-handle">valmortheos</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>
      </ul>
    </section>

    <footer class="footer reveal">
      <p>© 2025 Valmortheos</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
